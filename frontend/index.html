
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubeShop - Product Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #326ce5;
            color: white;
            padding: 25px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 35px auto;
            padding: 20px;
        }

        .form-card, .products-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        input, button {
            padding: 12px;
            margin: 5px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        input {
            width: 40%;
        }

        button {
            background: #326ce5;
            color: white;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background: #2454bd;
        }

        .delete-btn {
            background: #dc3545;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        #message {
            margin: 15px 0;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            input {
                width: 100%;
                margin: 5px 0;
            }

            .product {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Welcome to KubeShop!</h1>
    <p>Product Management - Powered by Kubernetes</p>
</header>

<main>

    <section class="form-card">
        <h2>Add a Product</h2>

        <form id="productForm">
            <input
                type="text"
                id="name"
                placeholder="Product name"
                required
            >

            <input
                type="number"
                id="price"
                placeholder="Price"
                min="0"
                step="0.01"
                required
            >

            <button type="submit">Add Product</button>
        </form>

        <p id="message"></p>
    </section>

    <section class="products-card">
        <h2>Products</h2>
        <div id="products">Loading products...</div>
    </section>

</main>

<script>
    const API_URL = "/api/products";

    async function loadProducts() {
        const container = document.getElementById("products");

        try {
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Could not load products");
            }

            const products = await response.json();

            container.innerHTML = "";

            if (products.length === 0) {
                container.textContent = "No products available.";
                return;
            }

            products.forEach(product => {
                const item = document.createElement("div");
                item.className = "product";

                const info = document.createElement("span");
                info.textContent =
                    `${product.name} - ${Number(product.price).toFixed(2)}`;

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";
                deleteButton.addEventListener("click", () => {
                    deleteProduct(product.id);
                });

                item.append(info, deleteButton);
                container.appendChild(item);
            });

        } catch (error) {
            container.textContent = "Error loading products.";
            console.error(error);
        }
    }

    document.getElementById("productForm")
        .addEventListener("submit", async function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const price = Number(document.getElementById("price").value);
            const message = document.getElementById("message");

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ name, price })
                });

                if (!response.ok) {
                    throw new Error("Could not create product");
                }

                message.textContent = "Product added successfully!";
                message.style.color = "green";

                this.reset();
                loadProducts();

            } catch (error) {
                message.textContent = "Error adding product.";
                message.style.color = "red";
            }
        });

    async function deleteProduct(id) {
        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error("Could not delete product");
            }

            loadProducts();

        } catch (error) {
            alert("Error deleting product.");
        }
    }

    loadProducts();
</script>

</body>
</html>
